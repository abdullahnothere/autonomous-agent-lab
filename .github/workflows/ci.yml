name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          missing=0
          for f in CLAUDE.md README.md docs/architecture.md docs/decisions.md docs/progress.md; do
            [ -f "$f" ] || { echo "Missing: $f"; missing=1; }
          done
          exit $missing

      - name: Validate agent definitions
        run: ./scripts/validate-agents.sh

      - name: Check for committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "A .env file is committed. Remove it and use .env.example instead."
            exit 1
          fi

  node:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    needs: repo-checks
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present
